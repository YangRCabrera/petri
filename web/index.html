<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petri</title>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <h1>Petri</h1>
        <p id="app-hint">Press <kbd>Enter</kbd> to pause</p>
        <p id="tick-duration"></p>
      </header>
      <div id="layout">
        <details id="controls" open>
          <summary id="controls-toggle">Controls</summary>
          <label id="species-field">
            Species
            <span class="select-wrap">
              <select id="species-select"></select>
            </span>
          </label>
          <div id="rle-import-form">
            <label>
              Import pattern (RLE)
              <textarea
                id="rle-input"
                rows="3"
                placeholder="Paste RLE cell data, or choose a file"
              ></textarea>
            </label>
            <div id="rle-import-controls">
              <input type="file" id="rle-file" accept=".rle,text/plain" />
              <button type="button" id="rle-import">Import</button>
            </div>
            <p id="rle-error" role="alert"></p>
          </div>
          <div id="params-form">
            <label>
              Growth target
              <input
                type="number"
                id="growth-target"
                step="0.001"
                min="0"
                max="1"
                value="0.15"
              />
            </label>
            <label>
              Growth width
              <input
                type="number"
                id="growth-width"
                step="0.001"
                min="0.001"
                value="0.015"
              />
            </label>
            <label>
              Time step
              <input
                type="number"
                id="time-step"
                step="0.001"
                min="0.001"
                value="0.1"
              />
            </label>
            <label>
              Kernel radius
              <input
                type="number"
                id="kernel-radius"
                step="1"
                min="1"
                value="10"
              />
            </label>
            <label>
              Ring weights
              <input type="text" id="ring-weights" value="1.0" />
            </label>
          </div>
          <p id="params-error" role="alert"></p>
        </details>
        <script>
          // Runs synchronously, before first paint, so mobile never flashes
          // the panel open — desktop's toggle is CSS-hidden, so it stays
          // open permanently there. Keep the width in sync with style.css's
          // "max-width: 720px" breakpoint.
          if (window.matchMedia('(max-width: 720px)').matches) {
            document.getElementById('controls').removeAttribute('open');
          }
        </script>
        <main id="stage">
          <canvas id="sim-canvas"></canvas>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
